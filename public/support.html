<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>GlassFire Support</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/GlassFireStudios/glassfirebrandassets@main/GlassFire%20Design%20System/colors_and_type.css" />
  <style>
    /* GlassFire design system: black ground, Poppins, Fire for actions, Glass for status. */
    :root { --bg: var(--gf-black, #000); --card: var(--gf-graphite, #1A1A1F); --line: var(--gf-iron, #2A2A30); --ink: var(--gf-snow, #fff); --muted: var(--gf-fog, #B8B8BE);
      --accent: var(--gf-fire, #EE2750); --ok: var(--status-success, #2FBF71); --warn: var(--status-warning, #F2B33D); --bad: var(--gf-fire, #EE2750); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-sans, "Poppins", system-ui, sans-serif); -webkit-font-smoothing: antialiased; }
    main { max-width: 760px; margin: 0 auto; padding: 22px 18px 40px; display: grid; gap: 16px; }
    header { display: flex; align-items: center; gap: 12px; }
    header h1 { margin: 0; font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; }
    header h1 span { background: var(--gf-gradient-spark, linear-gradient(110deg, #00A8E4, #EE2750)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    header .who { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
    .status { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
    .chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
    .chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
    .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .choice { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px; text-align: left; color: var(--ink); cursor: pointer; font: inherit; }
    .choice b { display: block; font-size: 17px; margin-bottom: 2px; }
    .choice span { color: var(--muted); font-size: 13px; }
    .choice[aria-pressed="true"] { border-color: var(--accent); }
    .choice:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    form { display: grid; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
    textarea, input[type=text] { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button.go { background: var(--accent); color: #fff; border: 0; border-radius: var(--r-pill, 999px); padding: 11px 22px; font: 700 14px/1 var(--font-sans, Poppins, sans-serif); text-transform: uppercase; letter-spacing: .08em; cursor: pointer; }
    .choice b { font-weight: 700; }
    h2 { font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
    button.go:disabled { opacity: .5; cursor: default; }
    .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; flex: 1 1 160px; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
    .msg { font-size: 14px; }
    .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }
    h2 { font-size: 16px; margin: 6px 0 0; }
    .ticket { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
    .ticket .meta { color: var(--muted); font-size: 12px; }
    .ticket .reply { border-left: 3px solid var(--accent); padding-left: 10px; margin-top: 4px; }
    .notes { background: color-mix(in srgb, var(--warn) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="/fm/icon.svg" alt="" width="40" height="40" />
      <h1>GlassFire <span>Support</span></h1>
      <div class="who" id="who">Connecting…</div>
    </header>
    <div class="status" id="status"></div>
    <div class="notes hidden" id="notes"></div>

    <div class="choices" role="group" aria-label="What do you need?">
      <button class="choice" data-type="bug" aria-pressed="true"><b>Something's wrong</b><span>A problem on screen, in vMix, or with the Stream Deck</span></button>
      <button class="choice" data-type="question" aria-pressed="false"><b>Ask a question</b><span>Not sure how to do something</span></button>
      <button class="choice" data-type="media" aria-pressed="false"><b>Send new media</b><span>The client gave you a new video or graphic</span></button>
    </div>

    <form id="form">
      <label for="message"><span id="prompt">What's happening? What did you expect?</span>
        <textarea id="message" maxlength="4000"></textarea></label>
      <label for="files">Add files (photos of the screen, new videos or graphics)
        <input id="files" type="file" multiple /></label>
      <label for="contact">Your name or phone (so we can reach you)
        <input id="contact" type="text" maxlength="120" /></label>
      <div class="row"><button class="go" id="send" type="submit">Send to GlassFire</button><div class="bar hidden" id="bar"><i id="barFill"></i></div></div>
      <div class="msg" id="msg" role="status"></div>
    </form>

    <h2>Your requests</h2>
    <div id="tickets"><p class="chip">None yet.</p></div>
  </main>
  <script src="/fm/support.js"></script>
</body>
</html>
