<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Screen check</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/GlassFireStudios/glassfirebrandassets@main/GlassFire%20Design%20System/colors_and_type.css" />
  <style>
    /* GlassFire design system: black ground, Poppins, heavy uppercase display. */
    :root { --bg: var(--gf-black, #000); --card: var(--gf-graphite, #1A1A1F); --line: var(--gf-iron, #2A2A30); --muted: var(--gf-fog, #B8B8BE);
      --ok: var(--status-success, #2FBF71); --warn: var(--status-warning, #F2B33D); --bad: var(--gf-fire, #EE2750); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: #fff; font-family: var(--font-sans, "Poppins", system-ui, sans-serif); -webkit-font-smoothing: antialiased; }
    main { max-width: 1100px; margin: 0 auto; padding: clamp(16px, 4vw, 48px); }
    h1 { margin: 0 0 4px; font-size: clamp(24px, 3.4vw, 40px); font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; }
    .verdict { text-transform: uppercase; font-weight: 800 !important; letter-spacing: -.02em; }
    .card .v { font-weight: 700 !important; }
    button { border-radius: var(--r-pill, 999px) !important; text-transform: uppercase; letter-spacing: .08em; font-weight: 700 !important; }
    button:not(.secondary) { background: var(--gf-fire, #EE2750) !important; color: #fff !important; }
    .muted { color: var(--muted); }
    .top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: clamp(16px, 3vw, 32px); }
    .code { font: 700 clamp(28px, 5vw, 56px)/1 ui-monospace, Consolas, monospace; letter-spacing: .12em; padding: 10px 18px; border: 2px solid var(--line); border-radius: 12px; }
    .verdict { font-size: clamp(30px, 6vw, 72px); font-weight: 750; line-height: 1.05; margin: 0 0 8px; }
    .verdict.k4 { color: var(--ok); } .verdict.p1080 { color: var(--warn); } .verdict.weak { color: var(--bad); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: clamp(16px, 3vw, 32px); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .card .k { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .card .v { font-size: clamp(18px, 2.2vw, 26px); font-weight: 650; margin-top: 4px; }
    .yes { color: var(--ok); } .no { color: var(--bad); } .maybe { color: var(--warn); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
    input { background: var(--card); color: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; min-width: 240px; }
    button { background: #fff; color: #000; border: 0; border-radius: 8px; padding: 10px 16px; font: 600 15px/1 inherit; cursor: pointer; }
    button.secondary { background: transparent; color: #fff; border: 1px solid var(--line); }
    .status { margin-top: 14px; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div><h1>Screen check</h1><div class="muted">Tests what this screen can play. Nothing to click; it runs by itself.</div></div>
      <div class="code" id="code" title="This screen's code">----</div>
    </div>
    <div class="verdict" id="verdict">Checking…</div>
    <div class="muted" id="verdictSub"></div>
    <div class="grid" id="grid"></div>
    <div class="row">
      <input id="name" maxlength="60" placeholder="Name this screen (e.g. Lobby TV 3)" />
      <button id="save">Save name</button>
      <button class="secondary" id="again">Run again</button>
    </div>
    <div class="status muted" id="status"></div>
  </main>
  <script src="https://player.live-video.net/1.36.0/amazon-ivs-player.min.js" async id="ivsjs"></script>
  <script src="/check.js"></script>
</body>
</html>
