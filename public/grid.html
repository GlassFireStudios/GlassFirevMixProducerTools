<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>GlassFire Producer Grid</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/GlassFireStudios/glassfirebrandassets@main/GlassFire%20Design%20System/colors_and_type.css" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" type="image/svg+xml" href="/brand/livetools-icon.svg" />
</head>
<body>
  <nav class="switcher" id="switcher"></nav>
  <main>
    <div class="grid" id="grid"></div>
  </main>

  <script src="/util.js"></script>
  <script src="/cards.js"></script>
  <script>
    const store = GF.Store();
    const switcherEl = document.getElementById('switcher');
    const gridEl = document.getElementById('grid');

    store.onChange(() => {
      GF.renderSwitcher(switcherEl, store.streams, store.states, null);
      GF.renderCards(gridEl, store.streams, store.states);
    });

    GF.connectWS((msg) => store.handle(msg));

    window.addEventListener('keydown', (e) => {
      if (e.target.matches('input,select,textarea')) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9 && store.streams[n - 1]) {
        location.href = GF.withToken('/s/' + encodeURIComponent(store.streams[n - 1].id));
      }
    });

    function frame() {
      GF.tickCards(gridEl, store.streams, store.states);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
